    <script>
      // Set the theme before first paint so there is no flash of the other one.
      try {
        var t = JSON.parse(localStorage.getItem("blendy.ui") || "{}").theme;
        document.documentElement.dataset.theme = t === "dark" || t === "light" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (e) {}
    </script>

    <div id="root"></div>
